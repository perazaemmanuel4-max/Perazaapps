
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>PerazaApps | Videojuegos</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #050505;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
}
header {
  padding: 28px 16px;
  text-align: center;
  border-bottom: 1px solid #39ff14;
}
h1 { color: #39ff14; margin: 0; }
header p { color: #aaa; }
main { max-width: 850px; margin: auto; padding: 24px 16px; }
h2 { color: #39ff14; }
.juego {
  background: #111;
  border: 1px solid #254d22;
  border-radius: 12px;
  padding: 20px;
  margin: 18px 0;
}
.juego p { color: #bbb; line-height: 1.5; }
.descargar {
  display: inline-block;
  padding: 13px 18px;
  background: #39ff14;
  color: #050505;
  font-weight: bold;
  text-decoration: none;
  border-radius: 7px;
}
.descargar:hover { background: #a0ff91; }
footer {
  padding: 25px;
  text-align: center;
  color: #888;
  border-top: 1px solid #222;
}
</style>
</head>
<body>
<header>
  <h1>PerazaApps</h1>
  <p>Videojuegos creados por mí</p>
</header>

<main>
  <h2>🎮 Mis videojuegos</h2>

  <section class="juego">
    <h3>Mi primer juego</h3>
    <p>Un videojuego para Android. Próximamente más aventuras.</p>
    <a class="descargar"
       href="https://example.com/mi-juego.apk">
       Descargar APK
    </a>
  </section>

  <p>Más juegos estarán disponibles próximamente.</p>
</main>

<footer>
  © 2026 PerazaApps · Todos los derechos reservados
</footer>
</body>
</html>
